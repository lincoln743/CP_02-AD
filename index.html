<!DOCTYPE html> <!-- avisa o navegador que é HTML5 -->
<html lang="pt-BR"> <!-- idioma da página em português -->
<head> <!-- começo do cabeçalho (coisas que não aparecem na tela) -->
    <meta charset="UTF-8"> <!-- pra acentuação funcionar certo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- deixa a página responsiva no celular -->
    <title>CP2 - Elenco | Lincoln Pereira</title> <!-- texto que aparece na aba do navegador -->
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- adianta a conexão com o google fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- mesma coisa, pro servidor dos arquivos da fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Archivo:wght@400;600&display=swap" rel="stylesheet"> <!-- importa as fontes Fraunces (títulos) e Archivo (texto) -->
    <link rel="stylesheet" href="style.css"> <!-- liga o meu arquivo de estilo -->
</head> <!-- fim do cabeçalho -->
<body> <!-- aqui começa o que aparece na tela -->

    <header class="topo"> <!-- parte de cima da página -->
        <p class="sobretitulo">Checkpoint 2 &middot; Application Development</p> <!-- linha pequena em cima do título -->
        <h1 class="titulo">Elenco</h1> <!-- título principal do app -->
        <p class="subtitulo">Atores e atrizes das séries mais conhecidas</p> <!-- explicação curta do que é o app -->
    </header> <!-- fim do topo -->

    <main class="conteudo"> <!-- área principal da página -->

        <section class="busca"> <!-- bloco do campo de pesquisa -->
            <label for="campoBusca" class="busca-label">Buscar pelo nome</label> <!-- texto do campo, ligado ao input pelo id -->
            <input type="text" id="campoBusca" class="busca-input" placeholder="Ex: Zendaya, Pedro, Tom..." oninput="filtrarAtores()" autocomplete="off"> <!-- campo de texto que chama a função de filtro toda vez que digita -->
            <p id="contador" class="contador"></p> <!-- aqui o js escreve quantos cards estão aparecendo -->
        </section> <!-- fim do bloco de busca -->

        <section id="grid" class="grid"></section> <!-- div vazia onde o js vai colocar os cards -->

        <p id="semResultado" class="sem-resultado">Nenhum ator ou atriz encontrado com esse nome.</p> <!-- mensagem que só aparece se o filtro não achar ninguém -->

    </main> <!-- fim da área principal -->

    <footer class="rodape"> <!-- rodapé da página -->
        <p>Lincoln Pereira &middot; RM567284 &middot; Turma 2CCPS &middot; FIAP</p> <!-- meus dados -->
        <p class="fonte">Dados e fotos: TVmaze</p> <!-- de onde vieram as informações -->
    </footer> <!-- fim do rodapé -->

    <script src="dados.js"></script> <!-- carrega o array de atores primeiro (tem que vir antes do script) -->
    <script src="script.js"></script> <!-- carrega a lógica que monta e filtra os cards -->
</body> <!-- fim do corpo -->
</html> <!-- fim do documento -->
